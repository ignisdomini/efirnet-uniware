; ============================================================================
;  EFIRNET UNIWARE V.1 — менеджер загрузки (раздел factory)
;
;  Сборка всех плат:   pio run
;  Одной платы:        pio run -e heltec_v3
;  Заливка:            pio run -e heltec_v3 -t upload
;
;  Пины берутся из board_pins.h проекта ЭФИРНЕТ — тот же файл, что у самой
;  прошивки. Поэтому новая плата добавляется сюда одним окружением: флаг
;  -D BOARD_* и подходящая таблица разделов, больше ничего.
;
;  ВАЖНО: обычная заливка PlatformIO пишет boot_app0.bin в otadata (0xe000)
;  и тем самым переводит плату на ota_0. Чтобы вернуться в меню, после
;  заливки сотрите otadata:  esptool.py erase_region 0xe000 0x2000
; ============================================================================
[platformio]
default_envs = heltec_v3

[env]
framework     = arduino
platform      = espressif32@^6.9.0
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    olikraus/U8g2 @ ^2.35.30

build_flags =
    ; Распиновка берётся из board_pins.h проекта ЭФИРНЕТ. В репозитории лежит
    ; его копия — чтобы собиралось у любого, кто просто склонировал этот проект,
    ; без второго репозитория рядом. Обновить копию: python tools/sync_board_pins.py
    -I include
    -D CORE_DEBUG_LEVEL=1
    -Os

; --------------------------------------------------------- ESP32-S3, 8 МБ
[env:heltec_v3]
board = heltec_wifi_lora_32_V3
board_build.partitions = ../partitions_triboot_8mb.csv
build_flags = ${env.build_flags}
    -D BOARD_HELTEC_V3
    -D ARDUINO_USB_MODE=1
    ; У Heltec V3 разъём USB-C идёт на мост CP2102, нативный USB ESP32-S3 к нему
    ; не разведён. С CDC_ON_BOOT=1 лог ушёл бы в несуществующий порт.
    -D ARDUINO_USB_CDC_ON_BOOT=0

[env:heltec_stick_lite_v3]
; Та же начинка, что у V3, но экрана нет: меню озвучивается светодиодом и UART.
board = heltec_wifi_lora_32_V3
board_build.partitions = ../partitions_triboot_8mb.csv
build_flags = ${env.build_flags}
    -D BOARD_HELTEC_STICK_LITE_V3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0

[env:lilygo_t3s3]
board = esp32-s3-devkitc-1
board_build.partitions = ../partitions_triboot_8mb.csv
build_flags = ${env.build_flags}
    -D BOARD_LILYGO_T3S3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; -------------------------------------------------------- ESP32-S3, 16 МБ
[env:heltec_v4]
board = esp32-s3-devkitc-1
board_build.flash_mode  = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions  = ../partitions_triboot_16mb.csv
board_upload.use_1200bps_touch    = true
board_upload.wait_for_upload_port = true
build_flags = ${env.build_flags}
    -D BOARD_HELTEC_V4
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:heltec_v4_r8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode  = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions  = ../partitions_triboot_16mb.csv
board_upload.use_1200bps_touch    = true
board_upload.wait_for_upload_port = true
build_flags = ${env.build_flags}
    -D BOARD_HELTEC_V4_R8
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ------------------------------------------------------------ ESP32, 8 МБ
[env:heltec_v2]
board = heltec_wifi_lora_32_V2
board_build.partitions = ../partitions_triboot_8mb.csv
build_flags = ${env.build_flags}
    -D BOARD_HELTEC_V2
