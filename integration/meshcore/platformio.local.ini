; ============================================================================
;  EFIRNET UNIWARE V.1 — сборки MeshCore для слота ota_2 мультизагрузчика
;
;  Отличий от штатных companion_radio_ble четыре:
;    1. своя таблица разделов (8 или 16 МБ, в зависимости от платы);
;    2. образ уезжает в ota_2, а не в app0;
;    3. подключена папка dualboot/ — возврат в меню и режим «меню всегда»;
;    4. в исходнике SPIFFS смонтирован на раздел mc_fs, а не на общий spiffs
;       (examples/companion_radio/main.cpp — правка одной строки).
;
;  board_build.app_partition_name обязателен: иначе PlatformIO сверяет размер
;  с первым app-разделом таблицы (factory, 448 КБ) и валит сборку.
;
;  Сборка всех:  pio run -e Heltec_v3_uniware -e Heltec_WSL3_uniware ...
; ============================================================================
[uniware8]
build_src_filter_add = +<../dualboot/>
partitions = partition-uniware-8mb.csv
offset     = 0x400000

[uniware16]
partitions = partition-uniware-16mb.csv
offset     = 0x600000

[env:Heltec_v3_uniware]
extends = env:Heltec_v3_companion_radio_ble
board_build.partitions         = ${uniware8.partitions}
board_upload.offset_address    = ${uniware8.offset}
board_build.app_partition_name = app_mc
build_flags = ${env:Heltec_v3_companion_radio_ble.build_flags} -D DUALBOOT_ALWAYS_MENU=1
build_src_filter = ${env:Heltec_v3_companion_radio_ble.build_src_filter} +<../dualboot/>

[env:Heltec_WSL3_uniware]
extends = env:Heltec_WSL3_companion_radio_ble
board_build.partitions         = ${uniware8.partitions}
board_upload.offset_address    = ${uniware8.offset}
board_build.app_partition_name = app_mc
build_flags = ${env:Heltec_WSL3_companion_radio_ble.build_flags} -D DUALBOOT_ALWAYS_MENU=1
build_src_filter = ${env:Heltec_WSL3_companion_radio_ble.build_src_filter} +<../dualboot/>

[env:LilyGo_T3S3_uniware]
extends = env:LilyGo_T3S3_sx1262_companion_radio_ble
board_build.partitions         = ${uniware8.partitions}
board_upload.offset_address    = ${uniware8.offset}
board_build.app_partition_name = app_mc
build_flags = ${env:LilyGo_T3S3_sx1262_companion_radio_ble.build_flags} -D DUALBOOT_ALWAYS_MENU=1
build_src_filter = ${env:LilyGo_T3S3_sx1262_companion_radio_ble.build_src_filter} +<../dualboot/>

[env:Heltec_v2_uniware]
extends = env:Heltec_v2_companion_radio_ble
board_build.partitions         = ${uniware8.partitions}
board_upload.offset_address    = ${uniware8.offset}
board_build.app_partition_name = app_mc
build_flags = ${env:Heltec_v2_companion_radio_ble.build_flags} -D DUALBOOT_ALWAYS_MENU=1
build_src_filter = ${env:Heltec_v2_companion_radio_ble.build_src_filter} +<../dualboot/>

[env:heltec_v4_uniware]
extends = env:heltec_v4_companion_radio_ble
board_build.partitions         = ${uniware16.partitions}
board_upload.offset_address    = ${uniware16.offset}
board_build.app_partition_name = app_mc
build_flags = ${env:heltec_v4_companion_radio_ble.build_flags} -D DUALBOOT_ALWAYS_MENU=1
build_src_filter = ${env:heltec_v4_companion_radio_ble.build_src_filter} +<../dualboot/>

[env:heltec_v4_r8_uniware]
extends = env:heltec_v4_r8_companion_radio_ble
board_build.partitions         = ${uniware16.partitions}
board_upload.offset_address    = ${uniware16.offset}
board_build.app_partition_name = app_mc
build_flags = ${env:heltec_v4_r8_companion_radio_ble.build_flags} -D DUALBOOT_ALWAYS_MENU=1
build_src_filter = ${env:heltec_v4_r8_companion_radio_ble.build_src_filter} +<../dualboot/>
