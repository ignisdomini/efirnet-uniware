; ============================================================================
;  EFIRNET UNIWARE V.1 — сборки Meshtastic для слота ota_1 мультизагрузчика
;
;  Исходники Meshtastic не правятся вовсе: в раскладке UNIWARE канонические
;  имена nvs и spiffs отданы именно ей, поэтому её код монтирования подходит
;  как есть. Единственное добавление — src/dualboot_return.cpp, который
;  подхватывается штатным build_src_filter.
;
;  Отличия от штатных окружений:
;    1. своя таблица разделов (8 или 16 МБ, по плате);
;    2. образ уезжает в ota_1, а не в app0;
;    3. -D DUALBOOT_ALWAYS_MENU=1 — возврат в меню при каждом включении.
;
;  board_build.app_partition_name обязателен: иначе PlatformIO сверяет размер
;  с первым app-разделом таблицы (factory, 448 КБ) и валит сборку.
;
;  Файл лежит в variants/esp32s3/, потому что этот путь уже перечислен в
;  extra_configs самой Meshtastic. Платы на обычном ESP32 описаны здесь же —
;  PlatformIO собирает все секции в одну таблицу, каталог роли не играет.
; ============================================================================
[env:heltec-v3-uniware]
extends = env:heltec-v3
board_build.partitions         = partition-uniware-8mb.csv
board_upload.offset_address    = 0x160000
board_build.app_partition_name = app_mt
build_flags = ${env:heltec-v3.build_flags} -D DUALBOOT_ALWAYS_MENU=1

