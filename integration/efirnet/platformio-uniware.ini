; ============================================================================
;  Слот ota_0 мультизагрузчика EFIRNET UNIWARE V.1
;
;  Отличия от обычных окружений: своя таблица разделов, свой раздел NVS
;  (канонический «nvs» отдан Meshtastic) и вставка возврата в меню из
;  dualboot/. Обычные окружения не тронуты — у них прежняя раскладка с OTA.
;
;  board_build.app_partition_name обязателен: без него PlatformIO сверяет
;  размер образа с первым app-разделом таблицы, то есть с factory на 448 КБ,
;  и валит сборку, хотя образ спокойно помещается в свой слот.
; ============================================================================
[uniware]
dir = ../../efirnet-dualboot
flags =
    -D EFIRNET_NVS_PARTITION=\"nvs_efr\"
    -D DUALBOOT_ALWAYS_MENU=1

[env:heltec_v3_uniware]
extends = env:heltec_v3
board_build.partitions         = ${uniware.dir}/partitions_triboot_8mb.csv
board_upload.offset_address    = 0x80000
board_build.app_partition_name = app_efr
build_src_filter = +<*> +<../dualboot/>
build_flags = ${env:heltec_v3.build_flags} ${uniware.flags}

